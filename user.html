<!DOCTYPE html>
<html lang="uk">
<head>
    <link rel="stylesheet" href="src/styles.css">
     <script src="https://kit.fontawesome.com/842793bbb5.js" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Mykyta Myrakhovskiy">
    <title>Особистий кабінет</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="shortcut icon" href="/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="OnlyFresh" />
    <link rel="manifest" href="/images/site.webmanifest" /> 
</head>
<body class="bg-cover">
    <header class="header flex-center">
        <div class="top-row flex-center">
            <nav class="nav">
            <ul>
                <li class="nav-item tr-color"><a href="catalog.html">Умови повернення</a></li>
                <li class="nav-item tr-color"><a href="#delivery">Доставка і оплата</a></li>
                <li class="nav-item tr-color"><a href="#about-us">Про нас</a></li>
            </ul>
            </nav>
        </div>

        <div class="under-row flex-center">
            <div class="logo-container">
                <img src="/images/logo.png" alt="Лого.png" class="logo"/>
            </div>

            <div class="phone-container">
                    <span class="flex-center">
                        <img src="https://i.ibb.co/WvWLg2ZH/image-88.png" alt="">
                        <p>+380XXXXXXXXX</p>
                    </span>
            </div>

            <a href="catalog.html" class="a-reset go-back-arrow">
                <span><i class="fa-solid fa-arrow-left-long"></i></span>
                До каталогу
            </a>

            <div class="icons-container">
                    <div class="icons-wrapper tr-color flex-center" id="open-cart-button">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <p id="cart-text">Мій кошик</p>
                        <span class="amount-display flex-center" id="amount-display-text">1</span>
                    </div>
                    
                    <div class="icons-wrapper tr-color icon-size burger-visible flex-center">
                        <div class="burger-menu">
                        <i class="fa fa-bars"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="profile-page">
        <section class="profile-info">
        <h1>Мій профіль</h1>
        <div class="profile-card">
            <p><strong>Ім’я:</strong> Іван</p>
            <p><strong>Email:</strong> test@example.com</p>
            <p><strong>Дата реєстрації:</strong> 12.09.2024</p>
            <button class="btn edit-btn" onclick="alert('Редагування профілю (імітація)')">Редагувати</button>
        </div>
        </section>
        <section class="orders-section">
        <h2>Історія замовлень</h2>
        <div>
            
        </div>
        </section>
        <section class="pop-up-overlay cart flex-center">
            <div class="pop-up">
                <span id="close-cart"><i class="fa-solid fa-xmark"></i></span>

                <h3>Кошик</h3>

                <table>
                    <thead>
                        <tr>
                            <td>Ваші товари:</td>
                            <td></td>
                            <td>Кількість:</td>
                            <td>Вартість:</td>
                        </tr>
                     </thead>
                    
                    <tbody id="cart-table-body">
                    <!-- cart products -->
                    </tbody>
                </table>

                <div class="cart-summary flex-center">
                    <h2>Загальна ціна:</h2>
                    <span id="sum-price"></span>
                </div>

                <div class="cart-buttons flex-center">
                    <button class="go-back-arrow">
                        <span><i class="fa-solid fa-arrow-left-long"></i></span>
                        <span id="go-back">До інших позицій</span>
                    </button>
                    <button class="btn make-order">
                        <span id="make-order">Зробити замовлення</span>
                    </button>
                </div>
            
                <h2>Рекомендуємо спробувати також:</h2>
                <div>
                <!-- Товари -->    
                </div>
            </div>
        </section>
    </main>
</body>
<script src="src/pages/cart.js"></script>
</html>
